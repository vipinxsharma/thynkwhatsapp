name: Application CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-schema:
    name: Verify database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: migration_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply and verify migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: app_test
          PGUSER: app_test
          PGPASSWORD: migration_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -1 \
            -f db/migrations/0001_self_service_identity.sql \
            -f db/migrations/0002_meta_waba_connections.sql \
            -f db/migrations/0003_support_cases.sql \
            -f db/migrations/0004_ai_support_resolution.sql \
            -f db/migrations/0005_workspace_invitations.sql \
            -f db/migrations/0006_durable_inbox.sql
          psql -v ON_ERROR_STOP=1 -f db/verify_schema.sql

  test-build-audit:
    name: Test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
